<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>在线客服</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .chat-container {
      width: 100%;
      max-width: 420px;
      height: 100vh;
      max-height: 700px;
      background: #fff;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    .chat-header {
      background: #8B4513;
      color: #fff;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .chat-header .avatar {
      width: 40px;
      height: 40px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .chat-header h3 {
      font-size: 16px;
      font-weight: 600;
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      background: #f8f9fa;
    }
    .message {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }
    .message.user {
      flex-direction: row-reverse;
    }
    .message .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .message.bot .avatar { background: #8B4513; }
    .message.user .avatar { background: #4CAF50; }
    .message .content {
      max-width: 70%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
    }
    .message.bot .content {
      background: #fff;
      color: #333;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }
    .message.user .content {
      background: #8B4513;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .chat-input {
      padding: 12px 16px;
      background: #fff;
      border-top: 1px solid #eee;
      display: flex;
      gap: 10px;
    }
    .chat-input input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 20px;
      font-size: 14px;
      outline: none;
    }
    .chat-input input:focus {
      border-color: #8B4513;
    }
    .chat-input button {
      padding: 0 20px;
      background: #8B4513;
      color: #fff;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
    }
    .welcome {
      text-align: center;
      color: #999;
      font-size: 12px;
      margin: 20px 0;
    }
    .transfer-btn {
      background: #ff6b6b;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 16px;
      cursor: pointer;
      font-size: 12px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <div class="avatar">🍵</div>
      <div>
        <h3>無界茶台客服</h3>
        <small>AI智能客服为您服务</small>
      </div>
    </div>
    
    <div class="chat-messages" id="messages">
      <div class="welcome">- 今天 -</div>
    </div>
    
    <div class="chat-input">
      <input type="text" id="messageInput" placeholder="请输入您的问题...">
      <button id="sendBtn">发送</button>
    </div>
  </div>

  <script src="chat.js"></script>
</body>
</html>
